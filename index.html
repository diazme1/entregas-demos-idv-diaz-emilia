<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entregas de Videojuegos — Emilia Díaz</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 2rem; background: #0f172a; color: #f8fafc; }
    main { width: min(37.5rem, 100%); }
    h1 { margin-bottom: .5rem; text-align: center; background: linear-gradient(135deg, #38bdf8, #818cf8); background-clip: text; color: transparent; }
    .subtitle { margin: 0 0 2.5rem; color: #94a3b8; text-align: center; }
    .card { display: flex; flex-direction: column; gap: .75rem; padding: 1.5rem; border: 1px solid #334155; border-radius: .75rem; background: #1e293b; color: inherit; text-decoration: none; transition: .2s ease; }
    .card:hover { transform: translateY(-4px); border-color: #38bdf8; box-shadow: 0 10px 25px -5px rgb(56 189 248 / 20%); }
    .card h2 { margin: 0; color: #38bdf8; }
    .card p { margin: 0; color: #94a3b8; line-height: 1.4; }
    .badge { align-self: flex-start; margin-top: .5rem; padding: .3rem .75rem; border-radius: 999px; background: #0284c7; color: white; font-size: .8rem; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Entregas de Videojuegos (IPV)</h1>
    <p class="subtitle">Emilia Díaz — Demos jugables en la web</p>
    <a href="entrega-2/" class="card">
      <h2>Entrega 2</h2>
      <p>Player con movimiento, cañón controlado con el mouse y torretas enemigas activas.</p>
      <span class="badge">Jugar Demo ▶</span>
    </a>
  </main>
</body>
</html>
